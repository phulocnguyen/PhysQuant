# Applied to newly generated scenes in every task family. Linear RGB, not sRGB.
# Table and background are sampled once per scene and applied at reset; neither changes geometry.
# One candidate color per scene; references and axis/goal markers keep their colors.
enabled: true
table:
  enabled: true
  options:
  - {name: slate, color_rgb: [0.12, 0.14, 0.18], source_texture: ''}
  - {name: warm_wood, color_rgb: [0.30, 0.22, 0.15], source_texture: ''}
  - {name: light_stone, color_rgb: [0.45, 0.43, 0.39], source_texture: ''}
  - {name: charcoal, color_rgb: [0.055, 0.06, 0.07], source_texture: ''}
  # LIBERO tabletop types; color_rgb is each texture's mean linear color. See assets/textures/libero/README.md.
  - {name: libero_wood, color_rgb: [0.563, 0.459, 0.36], source_texture: assets/textures/libero/martin_novak_wood_table.png}
  - {name: libero_wood_planks, color_rgb: [0.819, 0.58, 0.255], source_texture: assets/textures/libero/seamless_wood_planks_floor.png}
  - {name: libero_light_wood, color_rgb: [0.735, 0.517, 0.322], source_texture: assets/textures/libero/table_light_wood_seamless.png}
  - {name: libero_marble, color_rgb: [0.536, 0.523, 0.491], source_texture: assets/textures/libero/Marble062_COL_4K.png}
  - {name: libero_walnut, color_rgb: [0.119, 0.058, 0.036], source_texture: assets/textures/libero/living_room_table_walnut_seamless.png}
  - {name: libero_oak_desk, color_rgb: [0.346, 0.178, 0.058], source_texture: assets/textures/libero/desk_wood_panel_seamless.png}
candidates:
  enabled: true
  options:
  - {name: orange, color_rgb: [0.60, 0.18, 0.005]}
  - {name: teal, color_rgb: [0.005, 0.38, 0.28]}
  - {name: purple, color_rgb: [0.30, 0.015, 0.52]}
  - {name: pink, color_rgb: [0.65, 0.025, 0.22]}
background:
  enabled: true
  # Generated by tools/place_backgrounds.py; each entry places the workcell on open floor.
  catalog: configs/backgrounds.yaml
  # Names from the catalog to sample from uniformly; omit to use every catalog entry.
  options: null
