version: 5
templates:
  direct:
    split: seen
    text: '{action} {frame}'
  careful:
    split: seen
    text: Carefully, {action_lower} {frame}
    legacy_text: Using the indicated table frame, {action_lower} {frame}
  request:
    split: held_out
    text: Your task is to {action_lower} {frame}
